name: Shopify theme validation
on:
  push:
    branches:
      - feature/phase-1-storefront
  pull_request:
jobs:
  theme-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Shopify CLI
        run: npm install --global @shopify/cli
      - name: Validate Shopify theme
        run: shopify theme check --path .
